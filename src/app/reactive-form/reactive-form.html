<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Leave Application Form
        </h2>

        <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">

            <!-- Employee Name -->
            <div class="mb-3">
                <label class="form-label">
                    Employee Name
                </label>

                <input type="text" class="form-control" formControlName="employeeName" />

                <div class="text-danger mt-1" *ngIf="f['employeeName'].touched && f['employeeName'].invalid">
                    Employee Name is required
                </div>
            </div>

            <!-- Employee ID -->
            <div class="mb-3">
                <label class="form-label">
                    Employee ID
                </label>

                <input type="text" class="form-control" formControlName="employeeId" />

                <div class="text-danger mt-1" *ngIf="f['employeeId'].touched && f['employeeId'].invalid">
                    Employee ID is required
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>

                <input type="email" class="form-control" formControlName="email" />

                <div class="text-danger mt-1" *ngIf="f['email'].touched && f['email'].errors?.['required']">
                    Email is required
                </div>

                <div class="text-danger mt-1" *ngIf="f['email'].touched && f['email'].errors?.['email']">
                    Invalid email format
                </div>
            </div>

            <!-- Leave Type -->
            <div class="mb-3">
                <label class="form-label">
                    Leave Type
                </label>

                <select class="form-select" formControlName="leaveType">
                    <option value="">Select Leave Type</option>

                    <option *ngFor="let type of leaveTypes" [value]="type">
                        {{ type }}
                    </option>
                </select>

                <div class="text-danger mt-1" *ngIf="f['leaveType'].touched && f['leaveType'].invalid">
                    Leave Type is required
                </div>
            </div>

            <!-- From Date -->
            <div class="mb-3">
                <label class="form-label">
                    From Date
                </label>

                <input type="date" class="form-control" formControlName="fromDate" />

                <div class="text-danger mt-1" *ngIf="f['fromDate'].touched && f['fromDate'].invalid">
                    From Date is required
                </div>
            </div>

            <!-- To Date -->
            <div class="mb-3">
                <label class="form-label">
                    To Date
                </label>

                <input type="date" class="form-control" formControlName="toDate" />

                <div class="text-danger mt-1" *ngIf="f['toDate'].touched && f['toDate'].invalid">
                    To Date is required
                </div>
            </div>

            <!-- Reason -->
            <div class="mb-3">
                <label class="form-label">
                    Reason
                </label>

                <textarea rows="4" class="form-control" formControlName="reason"></textarea>

                <div class="text-danger mt-1" *ngIf="f['reason'].touched && f['reason'].invalid">
                    Reason is required
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    Submit
                </button>
            </div>

        </form>

    </div>

</div>
